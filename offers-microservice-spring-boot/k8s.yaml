apiVersion: apps/v1
kind: Deployment
metadata:
  name: offer-ui
  labels:
    app: offer-ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: offer-ui
  template:
    metadata:
      labels: 
        app: offer-ui
    spec:
      containers:
      - name: offer-ui
        image: "myacr.azurecr.io/offer-ui:latest"
        ports:
        - containerPort: 1001
        readinessProbe:  
            httpGet:
              path: /health
              port: 1004
            initialDelaySeconds: 5
            periodSeconds: 10  

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: offer-ui
  name: "offer"
spec:
  ports:
  - name: http
    port: 1001
    targetPort: 1001
  selector:
    app: offer-ui    